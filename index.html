<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#07111b"/><title>Planet Forge — Living Atlas</title></head>
<body><div id="app"><div id="viewer" aria-label="3D globe viewer"></div><aside class="panel"><div class="eyebrow">STINKY WEASEL PRODUCTIONS / WORLD SYSTEMS</div><h1>Planet Forge</h1><p class="lede">A seed becomes a world.</p><label for="seed">World seed</label><div class="seedbox"><input id="seed" value="ATLAS-001" aria-label="World seed"/><button id="generate">Forge</button></div><label for="layer">Atlas layer</label><select id="layer"><option value="biome">Biomes</option><option value="elevation">Elevation</option><option value="temperature">Temperature</option><option value="rainfall">Rainfall</option><option value="plates">Tectonic regions (proxy)</option></select><div class="stats" id="stats"></div><h2>Cell inspection</h2><div id="inspect" class="output">Click a point on the planet.</div><h2>Settlements</h2><div id="settlements" class="output"></div><h2>Chronicle</h2><div id="chronicle" class="output"></div><p class="notice">Prototype: all geophysical layers are conceptual approximations. Not a validated Earth-system model.</p><div class="links"><button id="random">Random seed</button><button id="export">Export atlas</button></div></aside></div><script type="module" src="/src/main.js"></script></body></html>
